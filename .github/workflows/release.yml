# Release di Zenith: parte quando si pubblica un tag vX.Y.Z.
#   test -> build Windows + build Linux (in parallelo) -> GitHub Release
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 1. Stessi controlli della CI: niente release se un test fallisce
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dipendenze di sistema Wails
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Frontend (check, test, build)
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - run: go test -tags webkit2_41 ./...

  # 2a. Windows: eseguibile portable + installer NSIS
  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa Wails CLI e NSIS
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          choco install nsis -y --no-progress
      - name: Build
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"          # es. v1.2.0
          $ver = $tag.TrimStart("v")               # es. 1.2.0
          wails build -ldflags "-X main.version=$tag"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$ver build\windows\installer\zenith.nsi
          Copy-Item build\bin\zenith.exe "build\bin\zenith-$ver-amd64-portable.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            build/bin/*-installer.exe
            build/bin/*-portable.exe
          if-no-files-found: error

  # 2b. Linux: tar.gz nel formato atteso da install.sh e zenith-update.sh
  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dipendenze di sistema Wails
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Installa Wails CLI e nfpm
        # nfpm richiede un Go più recente di go.mod: lo scarica solo per questi strumenti
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      # Versione del tag nei metadati AppStream (il file nel repo non ne ha),
      # poi convalida: metadati non validi = niente release
      - name: Metadati AppStream
        run: |
          sudo apt-get install -y appstream desktop-file-utils
          sh build/linux/metainfo-release.sh build/linux/io.github.alexis_82.zenith.metainfo.xml "${GITHUB_REF_NAME#v}" "$(date -u +%F)"
          desktop-file-validate build/linux/zenith.desktop
          appstreamcli validate --no-net build/linux/io.github.alexis_82.zenith.metainfo.xml
      - name: Build + pacchetti (.tar.gz, .deb e .rpm)
        run: |
          wails build -tags webkit2_41 -ldflags "-X main.version=${{ github.ref_name }}"
          sh build/linux/package.sh
          VERSION="${GITHUB_REF_NAME#v}" ARCH=amd64 nfpm pkg --config build/linux/nfpm.yaml --packager deb --target build/bin/
          dpkg-deb --info build/bin/zenith_*_amd64.deb
          dpkg-deb --contents build/bin/zenith_*_amd64.deb
          VERSION="${GITHUB_REF_NAME#v}" ARCH=amd64 nfpm pkg --config build/linux/nfpm.yaml --packager rpm --target build/bin/
      # Installa davvero l'.rpm: Fedora 40 è il minimo (glibc della build
      # Ubuntu 24.04), l'ultima Fedora usa dnf5. Niente release se fallisce.
      - name: Verifica .rpm su Fedora
        run: |
          for img in fedora:40 fedora:latest; do
            echo "::group::$img"
            docker run --rm -e VERSION="${GITHUB_REF_NAME#v}" -v "$PWD/build/bin:/pkg:ro" "$img" sh -euc '
              rpm -qpi /pkg/zenith-*.rpm
              rpm -qpR /pkg/zenith-*.rpm
              rpm -qpl /pkg/zenith-*.rpm
              rpm -qpi /pkg/zenith-*.rpm | grep -Eq "^License +: MIT$"
              if rpm -qpR /pkg/zenith-*.rpm | grep -E "libgtk-3-0|libwebkit2gtk-4.1-0"; then
                echo "dipendenze Debian nel pacchetto rpm" >&2; exit 1
              fi
              dnf install -y /pkg/zenith-*.rpm
              test "$(rpm -qf --qf "%{NAME}" /usr/bin/zenith)" = zenith
              if ldd /usr/bin/zenith 2>&1 | grep "not found"; then
                echo "librerie mancanti per /usr/bin/zenith" >&2; exit 1
              fi
              # AppStream: quello che legge Discover (nome, sviluppatore, pacchetto)
              M=/usr/share/metainfo/io.github.alexis_82.zenith.metainfo.xml
              grep -q "<release version=\"$VERSION\"" "$M"
              test -f /usr/share/icons/hicolor/scalable/apps/zenith.svg
              dnf install -y appstream
              appstreamcli refresh-cache --force
              appstreamcli get io.github.alexis_82.zenith --details | tee /tmp/appstream.txt
              grep -Eiq "^ *name: *zenith$" /tmp/appstream.txt
              grep -Eiq "^ *developer[^:]*: *alexis-82$" /tmp/appstream.txt
              grep -Eiq "^ *package[^:]*: *zenith$" /tmp/appstream.txt
            '
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            build/bin/zenith-linux-*.tar.gz
            build/bin/zenith_*.deb
            build/bin/zenith-*.rpm
          if-no-files-found: error

  # 3. Raccoglie i file, calcola i checksum e pubblica la release
  release:
    name: GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # serve per creare la release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # storia completa e tag, per le note di rilascio
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksum SHA-256
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      # Note = elenco dei commit dal tag precedente. Zenith le mostra
      # all'utente nella finestra di aggiornamento.
      - name: Note di rilascio
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          { echo "## Novità"; echo; git log --no-merges --pretty='- %s' "$range"; } > notes.md
          cat notes.md
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Zenith $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
